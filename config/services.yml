services:
    bastien59960.banners.acp.controller:
        class: bastien59960\banners\controller\acp_controller
        arguments:
            - '@dbal.conn'
            - '@template'
            - '@request'
            - '@user'
            - '@config'
            - '%core.table_prefix%'
            - '%core.root_path%'

    bastien59960.banners.listener:
        class: bastien59960\banners\event\listener
